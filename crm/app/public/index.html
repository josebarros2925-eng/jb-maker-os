<!doctype html>
<html lang="pt-BR">
<head>

  <title>CRM JB Maker</title>
  <link rel="icon" href="/logo.png">

  <div class="app">

        <a href="#leads" data-aba="leads">

        <a href="#semana" data-aba="semana">

        <a href="#entregas" data-aba="entregas">

        <b>Dica <span class="faisca">✦</span></b>
        <p id="dica-texto">Registre nicho e origem de cada lead: é isso que revela o seu cliente ideal.</p>
        <button class="botao primario" id="novo-lead">+ Novo lead</button>
      </div>
      <p class="rodape-lateral">Resumo pra IA<br><code>crm/Painel CRM.md</code></p>

    <main id="conteudo"><p class="carregando">Carregando…</p></main>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <div id="aviso" role="status" aria-live="polite"></div>

  <script src="/vendor/chart.js"></script>
  <script type="module" src="/app.js"></script>
